name: Claude Review

# Automatic review on pull requests.
#
# IMPORTANT, and not a misconfiguration: this does not run on pull requests
# opened from forks. GitHub deliberately withholds repository secrets from
# `pull_request` runs triggered by a fork, so ANTHROPIC_API_KEY would be empty
# and the job would fail confusingly. The guard below skips those runs
# explicitly instead.
#
# The safe-looking fix -- switching to `pull_request_target` -- is the opposite
# of safe: that trigger runs in this repository's context WITH secrets, against
# code the contributor controls, which is the standard way public repositories
# leak their secrets. Do not change it without understanding that.
#
# A useful side effect: because forks cannot trigger it, an outside contributor
# cannot spend API credit by opening pull requests.

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Same-repository branches only; see the note above. Dependabot is
    # excluded for the same reason forks are: GitHub withholds secrets from
    # runs it triggers, so the job could only ever fail. Its pull requests are
    # handled by dependabot-auto-merge.yml instead.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The `secrets` context cannot be used in a job-level `if`, so the
      # presence of the key is checked here instead. Without this the job
      # fails on every pull request whenever the secret is unset, which reads
      # as a broken build rather than as missing configuration.
      - name: Check for an API key
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::ANTHROPIC_API_KEY is not set; skipping the review.'
          fi

      - uses: actions/checkout@v5
        if: steps.preflight.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.preflight.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The branch is already checked out in the
            working directory.

            fixitalia presents Italian public-administration open data. Weight
            the review accordingly:

            - **Correctness of the data path above all.** An ingest that
              silently extracts zero rows, a filter that drops records without
              saying so, or an aggregate that sums a subset while the caption
              claims the whole, are the failures that matter most here: they
              produce a page that looks right and is wrong. Check that counts,
              totals and percentages are computed over the set the surrounding
              copy describes.
            - **Claims in user-facing copy must match what the query returns.**
              A headline stating a period, a total, or a coverage figure is a
              claim about the data. If the code cannot support it, say so.
            - **Statistical framing, not accusation.** Copy describes patterns
              that warrant attention; it never alleges wrongdoing. Flag any
              wording that crosses that line.
            - **Italian formatting.** Numbers, currency and dates go through
              Intl with the it-IT locale. Never hand-rolled.
            - **ISTAT codes are the join key** for anything with a geographic
              dimension. Place names are not: spelling variants and historical
              mergers create silent mismatches.
            - Then the usual: bugs, missing error handling, silent failures,
              type-safety escapes, and test coverage for the behaviour changed.

            Be specific and concise. Skip praise and skip restating the diff.
            If the change is sound, say so briefly rather than inventing
            findings.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues anchored to a line, and
            `gh pr comment` for anything about the change as a whole. Post
            through those tools only; do not return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
